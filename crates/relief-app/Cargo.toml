[package]
name = "relief-app"
description = "Desktop and web GUI for the relief-forge depth-map-to-3D-print tool."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
relief-core.workspace = true
bevy = { workspace = true, features = [
    "3d",
    "bevy_winit",
    "png",
    "jpeg",
    "tonemapping_luts",
] }
bevy_egui.workspace = true
# NOTE: no "bevy_egui" feature — it pins bevy_egui ^0.40 and we run 0.42.
bevy_panorbit_camera.workspace = true
serde.workspace = true
serde_json.workspace = true
glam.workspace = true
image.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { workspace = true, features = ["multi_threaded"] }
# Default features are xdg-portal + wayland, so no GTK dependency on Linux.
rfd = "0.17"
# Per-platform config path for the settings remembered between sessions.
directories = "6"

[target.'cfg(target_os = "linux")'.dependencies]
bevy = { workspace = true, features = ["x11", "wayland"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# WebGL2 rather than WebGPU: bevy cannot select a backend at runtime (see
# bevyengine/bevy#13168), so one bundle has to pick, and WebGL2 is the one that
# runs everywhere. Nothing in this app needs compute.
bevy = { workspace = true, features = ["webgl2"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
# Opening a file has no synchronous form in the browser; rfd's wasm backend
# wraps `<input type="file">` and hands back a future.
rfd = "0.17"
web-sys = { version = "0.3", features = [
    "Blob",
    "BlobPropertyBag",
    "Document",
    "HtmlAnchorElement",
    "Storage",
    "Url",
    "Window",
] }
