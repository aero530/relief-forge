[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["P. Spindler <aero530@gmail.com>"]
repository = "https://github.com/aero530/relief-forge"
# Driven by bevy 0.19 / bevy_egui 0.42 / egui 0.36, which all declare 1.95.
rust-version = "1.95"

[workspace.dependencies]
relief-core = { path = "crates/relief-core" }

# glam 0.32 is what bevy_math 0.19 depends on. Kept in lockstep so a `Vec3`
# built in relief-core *is* bevy's Vec3 and can be handed to a Mesh attribute
# without a conversion (and without a second glam in the tree).
glam = "0.32"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
# Only the two codecs we accept, so the wasm bundle carries no dead decoders.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# --- Bevy stack: pinned as a unit. ---
# bevy_panorbit_camera's `bevy_egui` feature wants bevy_egui ^0.40 while we run
# 0.42, so it is deliberately left OFF (the crate has no default features). We
# gate camera input against egui by hand, which the render-to-texture viewport
# needs anyway.
bevy = { version = "0.19", default-features = false }
bevy_egui = "0.42"
bevy_panorbit_camera = "0.35"

# Dependencies get optimized, our crates don't: fast Bevy at dev-build speed.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
