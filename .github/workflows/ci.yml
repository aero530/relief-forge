name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # bevy_winit's Wayland backend links the first two at build time; the X11
      # backend loads its libraries at runtime and needs nothing here.
      #
      # libudev is for gamepad support, which this app has no use for and does
      # not ask for: bevy_panorbit_camera depends on bevy with default features,
      # and cargo unifies those with ours, so bevy_gilrs — and its libudev-sys —
      # arrive whatever relief-app's own feature list says.
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libudev-dev
      - run: cargo fmt --all --check
      # Clippy's own output only reaches the log, which needs a token to read —
      # so a red tick tells you nothing without one. Re-emitting each diagnostic
      # as a workflow command puts them on the run as annotations, where they
      # show up inline on the diff and in the API.
      - name: Print the toolchain being linted against
        run: cargo clippy --version
      - name: cargo clippy
        run: |
          set -o pipefail
          if ! cargo clippy --workspace --all-targets --message-format=short -- \
               -D warnings 2>&1 | tee clippy.txt; then
            # One annotation carrying many lines, rather than one per line:
            # GitHub keeps at most ten annotations per step, so a line-per-line
            # dump silently loses the tail — which is exactly where the error is.
            # `%0A` is how a workflow command embeds a newline.
            python3 - <<'PY'
          import re
          noise = re.compile(r'^\s*(Compiling|Checking|Downloading|Downloaded|'
                             r'Updating|Fresh|Blocking|Building|Finished)\b')
          ansi = re.compile(r'\x1b\[[0-9;]*m')
          lines = [ansi.sub('', line.rstrip())
                   for line in open('clippy.txt', errors='replace')]
          keep = [line for line in lines if line.strip() and not noise.match(line)]
          print('::error::' + '%0A'.join(keep[-40:]))
          PY
            exit 1
          fi
      - run: cargo test --workspace

  wasm:
    name: wasm build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p relief-app --target wasm32-unknown-unknown
