# Build the Windows installer, prove it works, and attach it to the release.
#
# Triggered by pushing a version tag, or manually from the Actions tab. Tests run first:
# shipping an installer for code that does not pass its own suite is worse than shipping
# nothing.
#
# The MSI is authored by hand in installer/relief-forge.wxs rather than generated. dist's own
# msi is a cargo-wix template that installs per-machine behind a UAC prompt and produces one
# package per binary — so the app and the command-line tool would arrive as two separate
# installs of the same program.
name: Windows installer

on:
  push:
    tags: ['**[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (defaults to the workspace version)'
        required: false
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  installer:
    name: Windows installer
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the channel and components, so rustup honours it on the first
      # cargo invocation and no toolchain action is needed.
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-installer-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-installer-

      # Cached separately from the build: a 41 MB download that never changes unless the pinned
      # version in build.ps1 does.
      - name: Cache WiX toolset
        uses: actions/cache@v4
        with:
          path: target/installer-tools
          key: ${{ runner.os }}-wix-${{ hashFiles('installer/build.ps1') }}

      - name: Check
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      # -PinnedWix ignores the WiX that windows-latest happens to ship, so the artifact does not
      # depend on the runner image.
      - name: Build installer
        run: ./installer/build.ps1 -PinnedWix ${{ inputs.version && format('-Version {0}', inputs.version) || '' }}

      # The runner has no GPU and no interactive session, so launching the GUI would say nothing
      # useful. Everything else about the package is exercised: a per-user install with no
      # elevation, both binaries present, the command-line tool actually running, the shortcut,
      # the PATH entry, and an uninstall that leaves nothing behind.
      - name: Verify it installs, runs and uninstalls
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = (Get-Item target/installer/*.msi).FullName
          $dest = Join-Path $env:LOCALAPPDATA 'Programs\Relief Forge'
          $lnk = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Relief Forge.lnk'

          $p = Start-Process msiexec -ArgumentList @('/i', $msi, '/qn') -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "install failed with $($p.ExitCode)" }

          foreach ($file in 'relief-app.exe', 'relief.exe', 'LICENSE.txt', 'NOTICE.txt') {
            if (-not (Test-Path (Join-Path $dest $file))) { throw "$file was not installed" }
          }
          if (-not (Test-Path $lnk)) { throw 'no Start Menu shortcut' }
          if ([Environment]::GetEnvironmentVariable('PATH', 'User') -notlike '*Relief Forge*') {
            throw 'the install folder is not on the user PATH'
          }

          # The installed tool has to do its actual job, not merely start.
          & (Join-Path $dest 'relief.exe') sample -o "$env:TEMP\ci-sample.png"
          if ($LASTEXITCODE -ne 0) { throw 'the installed CLI could not write a sample' }
          & (Join-Path $dest 'relief.exe') convert "$env:TEMP\ci-sample.png" --px 256 -o "$env:TEMP\ci.stl" --check
          if ($LASTEXITCODE -ne 0) { throw 'the installed CLI could not produce a watertight mesh' }

          $p = Start-Process msiexec -ArgumentList @('/x', $msi, '/qn') -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "uninstall failed with $($p.ExitCode)" }
          if (Test-Path $dest) { throw 'the install folder was left behind' }
          if (Test-Path $lnk) { throw 'the shortcut was left behind' }
          if ([Environment]::GetEnvironmentVariable('PATH', 'User') -like '*Relief Forge*') {
            throw 'the PATH entry was left behind'
          }
          Write-Host 'installed, ran, and uninstalled cleanly'

      - uses: actions/upload-artifact@v4
        with:
          name: relief-forge-installer
          path: target/installer/*.msi
          if-no-files-found: error

      # Nothing else creates the release for this tag, so this does — and re-running the
      # workflow replaces the asset rather than failing on it.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if (-not (gh release view $tag 2>$null)) {
            gh release create $tag --title $tag --generate-notes
          }
          $msi = (Get-Item target/installer/*.msi).FullName
          gh release upload $tag $msi --clobber
        env:
          GH_TOKEN: ${{ github.token }}
