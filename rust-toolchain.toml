# Tracks stable. The MSRV floor is 1.95 (bevy 0.19, egui 0.36) and is enforced
# by `rust-version` in the workspace Cargo.toml.
#
# `components` and `targets` are declared so a fresh clone gets clippy, rustfmt
# and the wasm target without a separate rustup step.
[toolchain]
channel = "stable"
components = ["rustfmt", "clippy"]
targets = ["wasm32-unknown-unknown"]
