[build]
target = "crates/relief-app/index.html"
dist = "dist"

[serve]
address = "127.0.0.1"
port = 8080
open = false

# wasm-opt is disabled via data-wasm-opt="0" in index.html: trunk 0.20.1 cannot
# drive a Binaryen that accepts current rustc output (116 rejects the bulk-memory
# instructions rustc emits, 123 wants --enable-bulk-memory-opt which trunk 0.20
# never passes). Costs a few MB of download on the demo build. The fix is trunk
# >= 0.21, at which point the attribute can go.
